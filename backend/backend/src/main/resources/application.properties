spring.application.name=backend

# Database (overridden on Fly.io by FlyDatabaseEnvironmentPostProcessor)
spring.datasource.url=jdbc:postgresql://localhost:5432/project_management
spring.datasource.username=postgres
spring.datasource.password=yourpassword
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway — baseline existing DB at V1 so initial migration is not re-run
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# HikariCP - supports 1000+ concurrent users
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JWT — set JWT_SECRET env var in production (base64-encoded 32-byte key)
app.jwt.secret=${JWT_SECRET:REPLACE_WITH_BASE64_ENCODED_32_BYTE_KEY}
app.jwt.expiration=86400000

# Google OAuth2 — set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET env vars in production
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
app.oauth2.redirect-uri=${FRONTEND_URL:http://localhost:5173}/oauth2/callback

# Gmail SMTP — set MAIL_USERNAME and MAIL_PASSWORD env vars in production
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:YOUR_GMAIL_ADDRESS}
spring.mail.password=${MAIL_PASSWORD:YOUR_GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS — set FRONTEND_URL env var in production (e.g. https://pm-frontend.fly.dev)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

server.port=${PORT:8080}
